[project]
name = "hatua"
version = "0.1.0"
description = "A full-stack Jac application"
entry-point = "main"
kind = "web-app"
jac-version = "==0.37.25"

[dependencies]
[dependencies.npm]
react = "^19.2.0"
react-dom = "^19.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
"@tanstack/react-form" = "^1.33.0"
zod = "^4.3.6"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.7.0"
typescript = "^5.3.3"
"@types/react" = "^19.2.0"
"@types/react-dom" = "^19.2.0"



[dev-dependencies]
[dev-dependencies.pypi]
watchdog = ">=3.0.0"


[client]

[client.app_meta_data]
title = "Hatua · one step at a time"
description = "Hatua: an AI goal coach that turns big goals into small daily steps."
theme_color = "#2e6b34"
icon = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B1%3C/text%3E%3C/svg%3E"

[byllm.model]
default_model = "gemini/gemini-2.5-flash"
